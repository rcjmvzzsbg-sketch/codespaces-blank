name: Daily Screener Refresh

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Run daily pipeline (self-contained - ingest, derive, export)"
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python -m pipeline.run_daily

      - name: Commit and push output data
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@github.com"
          git add output/
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily refresh $(date -u +%F)"
          git push
