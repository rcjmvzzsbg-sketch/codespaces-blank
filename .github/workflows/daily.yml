name: Daily Screener Refresh

on:
  schedule:
    # Runs at 10:00 UTC on weekdays (Mon-Fri)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:  # Allows you to manually trigger it from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        run: python -m pipeline.run_daily

      - name: Commit and push output data
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@github.com"
          git add output/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily screener data"
          git push
