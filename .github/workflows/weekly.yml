name: Weekly Fundamental Refresh

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full ingest pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python -m pipeline.batch_ingest --fresh

      - name: Run derivations and metrics
        run: |
          python -m pipeline.derive
          python -m metrics.technicals
          python -m metrics.technicals2
          python -m metrics.risk
          python -m metrics.ttm

      - name: Export output
        run: python -m pipeline.export

      - name: Commit and push output data
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@github.com"
          git add output/
          git diff --quiet && git diff --staged --quiet || git commit -m "Weekly refresh $(date -u +%F)"
          git push

      - name: Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Stock Screener WEEKLY run failed"
          to: Reedspams@gmail.com
          from: Screener Bot
          body: "The weekly refresh failed on ${{ github.run_id }}. Check the Actions log."
