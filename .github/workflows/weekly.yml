name: Weekly Fundamental Refresh
on:
  schedule:
    - cron: '0 8 * * 0'      # 9:00 UTC weekdays (after US close)
  workflow_dispatch:            # allow manual runs
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Run daily pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python -m pipeline.run_fundamental
      - name: Commit refreshed output
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@screener"
          git add output/ screener.duckdb
          git commit -m "Daily refresh $(date -u +%F)" || echo "no changes"
          git push
      - name: Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Stock Screener WEEKLY run failed"
          to: Reedspams@gmail.com
          from: Screener Bot
          body: "The daily refresh failed on ${{ github.run_id }}. Check the Actions log."
